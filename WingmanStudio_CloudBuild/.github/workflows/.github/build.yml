name: Build Wingman Studio VST

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev

      - name: Configure project
        run: cmake -S WingmanStudio_CloudBuild -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel 2

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WingmanStudio-VST3
          path: build/**/*.vst3
          if-no-files-found: warn
